# Climatec — web service gratuito.
# O Blueprint liga o Postgres climatec-db (Render Postgres free, 30 dias)
# ao serviço automaticamente via DATABASE_URL.
services:
  - type: web
    name: climatec
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && python manage.py ensure_initial_admin && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /saude/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: climatec-db
          property: connectionString

databases:
  - name: climatec-db
    databaseName: climatec_db
    user: climatec_db_user
    postgresMajorVersion: "16"
    region: oregon
    plan: free
