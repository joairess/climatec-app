# Climatec — web service gratuito.
# O disco do plano free é efêmero: o SQLite some quando o serviço dorme ou faz deploy.
# Para dados persistentes, crie um Postgres e defina DATABASE_URL no serviço.
services:
  - type: web
    name: climatec
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /saude/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
